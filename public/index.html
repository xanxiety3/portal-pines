<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0868c0">
  <title>Compra tu pin de internet · GuajiraNet</title>
  <link rel="icon" href="/img/logo-guajiranet.png">
  <link rel="apple-touch-icon" href="/img/logo-guajiranet.png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="contenedor">
    <header class="marca">
      <img class="espiral-marca" src="/img/espiral-guajiranet.png" alt="GuajiraNet">
      <span class="nombre-marca">Guajira<em>Net</em></span>
      <h1>Compra tu pin de internet</h1>
      <p>Elige tu plan, paga y navega en segundos.</p>

      <div class="insignias">
        <span class="insignia">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12.5a11 11 0 0 1 14 0"/><path d="M8.5 16a6 6 0 0 1 7 0"/><circle cx="12" cy="19" r="1" fill="currentColor" stroke="none"/></svg>
          20 Mbps
        </span>
        <span class="insignia">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9.5 12l1.8 1.8L14.5 10"/></svg>
          Pago seguro
        </span>
        <span class="insignia">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
          Pin al instante
        </span>
      </div>
    </header>

    <main>
      <div class="planes" id="planes" role="radiogroup" aria-label="Planes disponibles"></div>
    </main>

    <p class="pie">GuajiraNet Telecomunicaciones</p>
  </div>

  <div class="barra-cta" id="barraCta">
    <div class="resumen">
      <div class="etiqueta" id="resumenEtiqueta">Selecciona un plan</div>
      <div class="monto" id="resumenMonto">—</div>
    </div>
    <button class="boton-primario" id="botonComprar" disabled>
      <span id="botonComprarTexto">Comprar ahora</span>
    </button>
  </div>

  <script src="/js/index.js"></script>
</body>
</html>
