<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10a828">
  <meta name="color-scheme" content="light">
  <title>Compra tu pin de internet · GuajiraNet</title>
  <link rel="icon" href="/img/espiral-guajiranet.png">
  <link rel="apple-touch-icon" href="/img/logo-guajiranet.png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="splash" class="splash" aria-hidden="true">
    <img class="splash-espiral" src="/img/espiral-guajiranet.png" alt="">
  </div>

  <div class="contenedor">
    <header class="marca">
      <img class="logo-marca" src="/img/logo-guajiranet.png" alt="GuajiraNet Telecomunicaciones">
      <h1>Compra tu pin de internet</h1>
      <p>Elige tu plan, paga y navega en segundos.</p>
    </header>

    <main>
      <section class="selector-planes">
        <div class="carrusel-planes" id="carrusel"></div>
        <div class="puntos-carrusel" id="puntos"></div>
        <p class="pista-deslizar">Desliza para ver los planes</p>
      </section>

      <section class="como-funciona">
        <h2>¿Cómo funciona?</h2>
        <div class="pasos-funciona">
          <div class="paso-funciona">
            <div class="num">1</div>
            <p>Elige tu plan</p>
          </div>
          <div class="paso-funciona">
            <div class="num">2</div>
            <p>Paga con QR o Bre-B</p>
          </div>
          <div class="paso-funciona">
            <div class="num">3</div>
            <p>Recibe tu pin al instante</p>
          </div>
        </div>
      </section>
    </main>

    <p class="pie">GuajiraNet Telecomunicaciones</p>
  </div>

  <div class="barra-cta" id="barraCta">
    <div class="barra-cta-interior">
      <div class="resumen">
        <div class="etiqueta" id="resumenEtiqueta">Selecciona un plan</div>
        <div class="monto" id="resumenMonto">—</div>
      </div>
      <button class="boton-primario" id="botonComprar" disabled>
        <span id="botonComprarTexto">Comprar ahora</span>
      </button>
    </div>
  </div>

  <script src="/js/favicon.js"></script>
  <script src="/js/index.js"></script>
</body>
</html>
